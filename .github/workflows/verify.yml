name: Verify ClubStack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Firestore security test helper
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2
      - name: Build and type-check
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore security rules
        run: npx --yes firebase-tools emulators:exec --project demo-clubstack --only firestore "node scripts/firestore.rules.test.mjs"
